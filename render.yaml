services:
  - type: web
    name: atelier-union
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run db:migrate && pnpm run db:seed && pnpm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atelier-union-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: KGD_ADMIN_EMAIL
        sync: false
      - key: KGD_ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: atelier-union-db
    databaseName: atelier_union
    user: atelier_union
    plan: free
    region: frankfurt
